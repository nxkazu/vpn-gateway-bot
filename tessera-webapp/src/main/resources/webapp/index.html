<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tessera VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#10131a;--panel:#171c26;--panel2:#202735;--text:#eef2f8;--muted:#98a2b3;--line:#2b3446;--acc:#52a8ff;--ok:#36d399;--warn:#f6ad55;--bad:#fb7185}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
button,a{font:inherit}button{border:0;cursor:pointer}a{color:inherit;text-decoration:none}
.shell{max-width:760px;margin:0 auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:38px;height:38px;border-radius:10px}.brand b{display:block;font-size:18px}.brand span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}.tabs button{height:40px;border-radius:8px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}.tabs button.active{background:var(--acc);border-color:var(--acc);color:#fff}
.view{display:none}.view.active{display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:var(--muted)}.title{font-size:16px;font-weight:700;margin:0 0 8px}.big{font-size:28px;line-height:1.1;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:84px}.meter{height:10px;background:#0d1118;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-top:10px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));width:0%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{height:44px;border-radius:8px;background:var(--panel2);color:var(--text);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px}.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.danger{color:var(--bad);border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.08)}
.device,.plan,.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}.device .main,.plan .main{font-weight:700}.device .sub,.plan .sub,.step .sub{color:var(--muted);font-size:12px;margin-top:2px}.device{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.mini{height:34px;border-radius:8px;padding:0 10px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}.empty{padding:28px 12px;text-align:center;color:var(--muted)}.error{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.4);color:#fecdd3}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
@media(max-width:430px){.grid,.actions{grid-template-columns:1fr}.pill{display:none}.big{font-size:24px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <img alt="" src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="18" fill="%2352a8ff"/><path d="M40 13l23 9v17c0 16-9 25-23 32-14-7-23-16-23-32V22l23-9z" fill="white" opacity=".95"/><path d="M29 41l7 7 16-18" fill="none" stroke="%2352a8ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
      <div><b>Tessera VPN</b><span id="who">...</span></div>
    </div>
    <div id="statusPill" class="pill">...</div>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="home">Обзор</button>
    <button data-tab="devices">Устройства</button>
    <button data-tab="plans">Тарифы</button>
  </nav>

  <section id="home" class="view active">
    <div id="homeBody"></div>
  </section>
  <section id="devices" class="view">
    <div id="devicesBody"></div>
  </section>
  <section id="plans" class="view">
    <div id="plansBody"></div>
  </section>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const initData = (tg && tg.initData) || new URLSearchParams(location.search).get('initData') || '';
let state = null;
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t = {
  ru:{overview:'Обзор', devices:'Устройства', plans:'Тарифы', status:'Статус', days:'Дней осталось', traffic:'Трафик', left:'Осталось', open:'Открыть подписку', buy:'Купить / продлить', setup:'Настройка', noSub:'Подписка не активна', noSubText:'Выберите тариф в боте или запустите пробный период.', remove:'Удалить', reset:'Сбросить все', noDevices:'Привязанных устройств нет', confirmRemove:'Удалить это устройство?', confirmReset:'Сбросить все устройства?', limit:'Лимит действий исчерпан. Попробуйте позже.', auth:'Откройте кабинет из Telegram.', advice:{OK:'Все работает штатно.',RENEW_SOON:'Срок скоро закончится.',RENEW_NOW:'Нужно продлить подписку.',TRAFFIC_HIGH:'Трафик почти закончился.'}},
  en:{overview:'Overview', devices:'Devices', plans:'Plans', status:'Status', days:'Days left', traffic:'Traffic', left:'Left', open:'Open subscription', buy:'Buy / extend', setup:'Setup', noSub:'Subscription inactive', noSubText:'Choose a plan in the bot or start a trial.', remove:'Remove', reset:'Reset all', noDevices:'No bound devices', confirmRemove:'Remove this device?', confirmReset:'Reset all devices?', limit:'Action limit reached. Try again later.', auth:'Open the cabinet from Telegram.', advice:{OK:'Everything looks good.',RENEW_SOON:'Renewal is close.',RENEW_NOW:'Subscription needs renewal.',TRAFFIC_HIGH:'Traffic is almost used up.'}}
};
function lang(){ const code = state?.user?.languageCode || 'ru'; return code.startsWith('ru') ? t.ru : t.en; }
function api(path, opts={}){
  return fetch(path,{...opts,headers:{'X-Telegram-Init-Data':initData,'Content-Type':'application/json',...(opts.headers||{})}})
    .then(async r => { const body = await r.json().catch(()=>({})); if(!r.ok){ throw Object.assign(new Error(body.error||r.statusText),{status:r.status}); } return body; });
}
function show(tab){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id===tab));
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function openLink(url){
  if(!url) return;
  if(tg && tg.openLink) tg.openLink(url); else window.open(url,'_blank');
}
function confirmBox(text, cb){
  if(tg && tg.showConfirm) tg.showConfirm(text, ok => ok && cb());
  else if(confirm(text)) cb();
}
function openSubscription(){ openLink(state?.subscription?.subscriptionUrl || ''); }
function openBot(){ openLink(state?.botUrl || ''); }
async function load(){
  if(!initData){ renderAuthError(); return; }
  state = await api('/api/me');
  render();
}
function render(){
  const L = lang(), u = state.user, s = state.subscription || {};
  $('who').textContent = u.username ? '@'+u.username : (u.firstName || 'Telegram');
  $('statusPill').textContent = s.active ? s.status : L.noSub;
  $('statusPill').className = 'pill ' + (s.active ? 'ok' : 'bad');
  renderHome(L,s); renderDevices(L,s); renderPlans(L);
}
function renderHome(L,s){
  if(!s.active){
    $('homeBody').innerHTML = `<div class="panel empty"><div class="title">${L.noSub}</div><div>${L.noSubText}</div></div>${actions(L,s)}`;
    return;
  }
  const pct = s.unlimitedTraffic ? 100 : Math.max(0, Math.min(100, s.usagePercent||0));
  $('homeBody').innerHTML = `
    <div class="grid">
      <div class="metric"><div class="muted">${L.status}</div><div class="big">${esc(s.status)}</div><div class="muted">${esc(s.expireAtText)}</div></div>
      <div class="metric"><div class="muted">${L.days}</div><div class="big">${s.daysLeft}</div><div class="muted">${esc(L.advice[s.advice]||'')}</div></div>
    </div>
    <div class="panel"><div class="row"><div><div class="title">${L.traffic}</div><div class="muted">${esc(s.usedText)} / ${esc(s.limitText)}</div></div><b>${s.unlimitedTraffic?'∞':pct+'%'}</b></div><div class="meter"><i style="width:${pct}%"></i></div><div class="muted" style="margin-top:8px">${L.left}: ${esc(s.remainingText)}</div></div>
    ${actions(L,s)}
    <div class="panel"><div class="title">${L.setup}</div>${setupSteps().map(x=>`<div class="step"><div class="main">${x[0]}</div><div class="sub">${x[1]}</div></div>`).join('')}</div>`;
}
function actions(L,s){
  const sub = s.subscriptionUrl ? `<button class="btn primary" onclick="openSubscription()">${L.open}</button>` : '';
  return `<div class="actions panel">
    ${sub}
    <button class="btn ${sub?'':'primary'}" onclick="openBot()">${L.buy}</button>
  </div>`;
}
function setupSteps(){
  return state?.user?.languageCode?.startsWith('ru')
    ? [['iOS / Android','Streisand, Hiddify, v2rayNG'],['Windows / macOS','Hiddify Desktop, Streisand'],['Android TV','Импорт subscription URL']]
    : [['iOS / Android','Streisand, Hiddify, v2rayNG'],['Windows / macOS','Hiddify Desktop, Streisand'],['Android TV','Import subscription URL']];
}
function renderDevices(L,s){
  const devices = s.devices || [];
  if(!s.active){ $('devicesBody').innerHTML = `<div class="panel empty">${L.noSub}</div>`; return; }
  $('devicesBody').innerHTML = `
    <div class="panel row"><div><div class="title">${L.devices}</div><div class="muted">${devices.length}</div></div><button class="btn danger" style="max-width:160px" onclick="resetDevices()">${L.reset}</button></div>
    ${devices.length ? devices.map(d=>`<div class="device"><div><div class="main">${esc(d.label)}</div><div class="sub">${esc(d.maskedHwid)}</div></div><button class="mini" onclick="removeDevice(${d.index})">${L.remove}</button></div>`).join('') : `<div class="panel empty">${L.noDevices}</div>`}`;
}
function renderPlans(L){
  $('plansBody').innerHTML = (state.plans||[]).map(p=>`
    <div class="plan"><div class="row"><div><div class="main">${esc(p.title)}</div><div class="sub">${p.days} days • ${p.trafficGb} GB</div></div><b>${p.priceRub} ₽</b></div></div>`).join('') +
    `<button class="btn primary" onclick="openBot()">${L.buy}</button>`;
}
async function removeDevice(index){
  const L=lang(); confirmBox(L.confirmRemove, async()=>{ try{ state=await api('/api/devices/'+index,{method:'DELETE'}); render(); }catch(e){ alert(e.status===429?L.limit:e.message); } });
}
async function resetDevices(){
  const L=lang(); confirmBox(L.confirmReset, async()=>{ try{ state=await api('/api/devices/reset',{method:'POST'}); render(); }catch(e){ alert(e.status===429?L.limit:e.message); } });
}
function renderAuthError(){ const L=t.ru; $('homeBody').innerHTML = `<div class="panel error">${L.auth}</div>`; }
load().catch(e => { $('homeBody').innerHTML = `<div class="panel error">${esc(e.message)}</div>`; });
</script>
</body>
</html>
