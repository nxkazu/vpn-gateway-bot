help=\u2139\uFE0F *Help*\n\n\u2022 \uD83D\uDED2 *Buy / Extend* \u2014 purchase or extend a subscription\n\u2022 \uD83D\uDCF1 *My subscription* \u2014 status, expiry and traffic\n\u2022 \uD83D\uDC65 *Referral program* \u2014 invite friends\n\u2022 \uD83C\uDF81 *Free trial* \u2014 free access for new users\n\nFor support, contact an administrator.
setup.menu=\uD83E\uDDED *Setup guide*\n\nChoose your device. The next screen gives the exact steps and your subscription button.
setup.menu.no_sub=\uD83E\uDDED *Setup guide*\n\nChoose your device to see the steps. You can buy or start a trial first if you do not have a subscription yet.
setup.guide.title=\uD83E\uDDED *Setup: {0}*
setup.open_hint=Open your subscription link with the button below, then import it in the app.
setup.no_subscription=You do not have an active subscription yet. Buy a plan or start a trial, then return here.
setup.platform.ios=iOS
setup.platform.android=Android
setup.platform.windows=Windows
setup.platform.macos=macOS
setup.platform.tv=Android TV
setup.guide.ios=1. Install Streisand, Hiddify or another subscription-compatible VPN client.\n2. Tap *Open subscription* below.\n3. Import the subscription into the app.\n4. Choose the nearest location and connect.\n\nTip: if the app asks how to open the link, pick your VPN client.
setup.guide.android=1. Install Hiddify, v2rayNG or another subscription-compatible VPN client.\n2. Tap *Open subscription* below.\n3. Import the subscription URL.\n4. Select a location and press connect.\n\nTip: enable auto-update for the profile so new nodes appear automatically.
setup.guide.windows=1. Install Hiddify Desktop or another subscription-compatible client.\n2. Copy/open the subscription link below.\n3. Add it as a remote profile/subscription.\n4. Update the profile and connect.\n\nTip: if traffic does not go through, enable system proxy/TUN mode in the client.
setup.guide.macos=1. Install Streisand, Hiddify or another subscription-compatible client.\n2. Open the subscription link below.\n3. Import it into the app and update the profile.\n4. Choose a location and connect.\n\nTip: allow VPN/network permissions when macOS asks.
setup.guide.tv=1. Install a compatible VPN client on Android TV.\n2. Send the subscription link to the TV or open it with the client.\n3. Import/update the profile.\n4. Pick the nearest location and connect.\n\nTip: for TV boxes, a QR/link transfer app is usually the fastest path.

