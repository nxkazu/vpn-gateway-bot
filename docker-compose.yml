services:
  postgres:
    image: postgres:16-alpine
    container_name: tessera-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME:-tessera}
      POSTGRES_USER: ${DB_USER:-tessera}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - tessera-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tessera} -d ${DB_NAME:-tessera}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tessera-net

  bot:
    build: .
    container_name: tessera-bot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      # Bound to loopback only — expose the dashboard via a TLS reverse proxy, never directly.
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
      # Ops API: /health, /metrics, payment webhooks and backup trigger.
      - "127.0.0.1:${OPS_PORT:-9090}:9090"
    volumes:
      - tessera-backups:/app/backups
    networks:
      - tessera-net

volumes:
  tessera-pgdata:
  tessera-backups:

networks:
  tessera-net:
    driver: bridge
