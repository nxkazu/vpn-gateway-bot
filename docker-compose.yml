services:
  postgres:
    image: postgres:16-alpine
    container_name: tessera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tessera}
      POSTGRES_USER: ${DB_USER:-tessera}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tessera}
    volumes:
      - tessera-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tessera} -d ${DB_NAME:-tessera}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tessera-net

  bot:
    build: .
    container_name: tessera-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    networks:
      - tessera-net

volumes:
  tessera-pgdata:

networks:
  tessera-net:
    driver: bridge
